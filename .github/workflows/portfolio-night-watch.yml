name: JPA Portfolio Night Watch

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jpa-portfolio-night-watch
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Portfolio tests
        run: python3 -m unittest discover -s tests -p "test_portfolio.py" -v

  rotate:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require read-only portfolio credential
        env:
          JPA_PORTFOLIO_TOKEN: ${{ secrets.JPA_PORTFOLIO_TOKEN }}
        run: test -n "$JPA_PORTFOLIO_TOKEN"
      - name: Run public/private portfolio rotation
        env:
          JPA_PORTFOLIO_TOKEN: ${{ secrets.JPA_PORTFOLIO_TOKEN }}
        run: |
          python3 auditor/portfolio.py \
            --owner jsonwisdom \
            --output portfolio-output \
            --stale-days 30
      - name: Publish rotation summary
        if: always()
        run: |
          if [ -f portfolio-output/portfolio-ledger.md ]; then
            cat portfolio-output/portfolio-ledger.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Night Watch failed before producing a ledger" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload portfolio evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jpa-portfolio-${{ github.run_id }}
          path: portfolio-output/
          if-no-files-found: error
          retention-days: 90
