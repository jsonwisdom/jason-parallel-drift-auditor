name: Jason Parallel-Drift Audit

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fail_on:
        description: Minimum severity that blocks the run
        required: false
        default: critical
        type: choice
        options: [critical, high, medium]

permissions:
  contents: read

concurrency:
  group: jpa-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  audit:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Run evidence-first audit
        env:
          FAIL_ON: ${{ inputs.fail_on || 'critical' }}
        run: |
          python3 auditor/audit.py \
            --root . \
            --config .github/jpa-audit.json \
            --output audit-output \
            --fail-on "$FAIL_ON"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jpa-audit-${{ github.sha }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

  publish-sarif:
    needs: audit
    if: always() && needs.audit.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download audit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: jpa-audit-${{ github.sha }}
          path: audit-output

      - name: Publish security findings
        uses: github/codeql-action/upload-sarif@b374143c1149a9115d881581d29b8390bbcbb59c
        with:
          sarif_file: audit-output/audit.sarif

      - name: Record SARIF publication state
        if: always()
        run: |
          echo "## SARIF publication" >> "$GITHUB_STEP_SUMMARY"
          echo "The optional Code Scanning integration ran separately from the required audit." >> "$GITHUB_STEP_SUMMARY"
