name: Jason Parallel-Drift Audit

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fail_on:
        description: Minimum severity that blocks the run
        required: false
        default: critical
        type: choice
        options: [critical, high, medium]

permissions:
  contents: read

concurrency:
  group: jpa-audit-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

  audit:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run evidence-first audit
        env:
          FAIL_ON: ${{ inputs.fail_on || 'critical' }}
        run: |
          python3 auditor/audit.py \
            --root . \
            --config .github/jpa-audit.json \
            --output audit-output \
            --fail-on "$FAIL_ON"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jpa-audit-${{ github.sha }}
          path: audit-output/
          if-no-files-found: error
          retention-days: 30

  publish-sarif:
    needs: audit
    if: always() && needs.audit.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: jpa-audit-${{ github.sha }}
          path: audit-output

      - name: Publish security findings
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: audit-output/audit.sarif

      - name: Record SARIF publication state
        if: always()
        run: |
          echo "## SARIF publication" >> "$GITHUB_STEP_SUMMARY"
          echo "The optional Code Scanning integration ran separately from the required audit." >> "$GITHUB_STEP_SUMMARY"
